name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022  # Visual Studio 2022: the v143 C++ toolset OpenParrot is built with
    steps:
      - uses: actions/checkout@v4

      - name: Read components.json
        id: components
        shell: pwsh
        run: |
          $c = Get-Content components.json -Raw | ConvertFrom-Json
          foreach ($name in 'TeknoParrotUI', 'OpenParrot', 'H2ODashboard') {
            "$($name)_repo=$($c.$name.repository)" >> $env:GITHUB_OUTPUT
            "$($name)_ref=$($c.$name.ref)" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.components.outputs.TeknoParrotUI_repo }}
          ref: ${{ steps.components.outputs.TeknoParrotUI_ref }}
          path: src/TeknoParrotUI
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.components.outputs.OpenParrot_repo }}
          ref: ${{ steps.components.outputs.OpenParrot_ref }}
          path: src/OpenParrot
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.components.outputs.H2ODashboard_repo }}
          ref: ${{ steps.components.outputs.H2ODashboard_ref }}
          path: src/H2ODashboard
          fetch-depth: 0

      - name: Build and package
        shell: pwsh
        run: ./package.ps1 -Source src -Version "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectH2O
          path: out/ProjectH2O.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/ProjectH2O.zip
          generate_release_notes: true
